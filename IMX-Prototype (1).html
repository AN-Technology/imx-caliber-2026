<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IMX — Integrated Manufacturing Execution</title>
    <style>
/* ========================================
   IMX — Integrated Manufacturing Execution
   Main Stylesheet
======================================== */

/* Mengatur seluruh halaman */
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f4f7fb;
    color: #102a43;
}

/* ========================================
   LAYOUT UTAMA
======================================== */
.app {
    display: flex;
    min-height: 100vh;
}

/* ========================================
   SIDEBAR
======================================== */

.sidebar {
    width: 240px;
    min-height: 100vh;
    background: #082b52;
    color: white;
    padding: 28px 20px;
}

.logo {
    font-size: 34px;
    font-weight: 800;
    margin: 0;
}

.brand-name {
    margin-top: 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    line-height: 1.4;
    color: #8fd3ff;
}

.tagline {
    margin-top: 25px;
    margin-bottom: 35px;
    font-size: 12px;
    line-height: 1.6;
    color: #d3e5f5;
}

/* ========================================
   MENU SIDEBAR
======================================== */

.menu {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.menu button {
    width: 100%;
    border: none;
    background: transparent;
    color: #dcecff;

    padding: 13px 14px;

    text-align: left;
    font-size: 14px;

    border-radius: 9px;
    cursor: pointer;
}

.menu button:hover {
    background: #124f88;
}

.menu button.active {
    background: #1b5f9e;
    color: white;
}
/* ========================================
   MAIN CONTENT
======================================== */
.main-content {
    width: calc(100% - 216px);
    margin-left: 216px;
    padding: 88px 30px 30px 30px;
    box-sizing: border-box;
}

.page-title {
    margin: 0;
    font-size: 28px;
}

.page-subtitle {
    margin-top: 7px;
    color: #6b7f93;
    font-size: 14px;
}

/* ========================================
   KPI CARDS
======================================== */

.kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-top: 28px;
}

.kpi-card {
    background: white;
    padding: 20px;
    border-radius: 14px;

    border: 1px solid #e2e8f0;

    box-shadow:
        0 3px 12px rgba(15, 42, 70, 0.06);
}

.kpi-label {
    font-size: 11px;
    color: #718096;
    text-transform: uppercase;
}

.kpi-value {
    margin-top: 12px;
    margin-bottom: 6px;

    font-size: 27px;
    font-weight: 800;

    color: #102a43;
}

.kpi-description {
    font-size: 12px;
    color: #718096;
}


/* ========================================
   RESPONSIVE
======================================== */

@media (max-width: 900px) {

    .kpi-grid {
        grid-template-columns: repeat(2, 1fr);
    }

}
/* ========================================
   ASSET HEALTH
======================================== */

.asset-summary {
    margin-top: 28px;
    max-width: 260px;
}

.table-card {
    margin-top: 22px;
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(15, 42, 70, 0.06);
}

.table-header {
    padding: 20px 22px;
    border-bottom: 1px solid #e2e8f0;
}

.table-header h2 {
    margin: 0;
    font-size: 17px;
    color: #102a43;
}

.table-header p {
    margin: 6px 0 0;
    font-size: 12px;
    color: #718096;
}

.table-wrapper {
    overflow-x: auto;
}

.asset-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

.asset-table th {
    padding: 88px 30px 30px 30px;
    text-align: left;
    background: #f8fafc;
    color: #64748b;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid #e2e8f0;
}

.asset-table td {
    padding: 15px 16px;
    border-bottom: 1px solid #edf2f7;
    color: #334e68;
}

.asset-table tbody tr:hover {
    background: #f8fbff;
}

.asset-table tbody tr:last-child td {
    border-bottom: none;
}

/* ========================================
   IMX STATUS & ASSET DETAIL
======================================== */

.page-heading-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
}

.data-label {
    background: #edf6ff;
    color: #1769aa;
    border: 1px solid #cfe8ff;
    padding: 8px 11px;
    border-radius: 8px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.7px;
}

.logic-note {
    margin-top: 20px;
    padding: 14px 16px;
    background: #f8fbff;
    border: 1px solid #dbeafe;
    border-radius: 10px;
    color: #52677b;
    font-size: 12px;
    line-height: 1.6;
}

.status-badge,
.priority-badge {
    display: inline-block;
    padding: 6px 9px;
    border-radius: 7px;
    font-size: 10px;
    font-weight: 800;
}

.status-green {
    background: #e8f7ee;
    color: #177245;
}

.status-amber {
    background: #fff4d6;
    color: #9a6700;
}

.status-red {
    background: #fdeaea;
    color: #b42318;
}

.priority-badge {
    background: #edf2f7;
    color: #334e68;
}

.small-text {
    margin-top: 4px;
    font-size: 10px;
    color: #8293a5;
}

.clickable-row {
    cursor: pointer;
}

.view-btn {
    border: none;
    background: transparent;
    color: #1769aa;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
}

.back-btn {
    border: none;
    background: transparent;
    color: #1769aa;
    padding: 0;
    margin-bottom: 24px;
    font-weight: 700;
    cursor: pointer;
}

.asset-detail-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
}

.asset-tag-large {
    margin-bottom: 7px;
    color: #1769aa;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
}

.asset-status-group {
    display: flex;
    gap: 8px;
}

.priority-large {
    font-size: 12px;
}

.detail-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-top: 28px;
}

.detail-section {
    margin-top: 22px;
    background: white;
    padding: 22px;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
}

.detail-section h2 {
    margin: 8px 0 20px;
    font-size: 19px;
}

.section-label {
    color: #718096;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.8px;
}

.failure-info-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
}

.failure-info-grid div {
    padding: 14px;
    background: #f8fafc;
    border-radius: 9px;
}

.failure-info-grid span {
    display: block;
    margin-bottom: 7px;
    color: #718096;
    font-size: 10px;
}

.failure-info-grid strong {
    font-size: 13px;
}

.investigation-cta {
    margin-top: 22px;
    padding: 22px;
    background: #082b52;
    color: white;
    border-radius: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 25px;
}

.investigation-cta h2 {
    margin: 7px 0;
    font-size: 18px;
}

.investigation-cta p {
    margin: 0;
    color: #c9dcec;
    font-size: 12px;
}

.primary-btn {
    border: none;
    background: white;
    color: #082b52;
    padding: 12px 17px;
    border-radius: 9px;
    font-weight: 800;
    cursor: pointer;
    white-space: nowrap;
}

@media (max-width: 1000px) {

    .detail-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .failure-info-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

/* ========================================
   CONDITION EVIDENCE
======================================== */

.evidence-description {
    margin-top: -10px;
    margin-bottom: 20px;
    color: #718096;
    font-size: 12px;
}
.condition-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}
.condition-card {
    padding: 17px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 11px;
}
.condition-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 15px;
}
.condition-name {
    color: #334e68;
    font-size: 12px;
    font-weight: 800;
}

.condition-unit {
    margin-top: 3px;
    color: #8293a5;
    font-size: 10px;
}

.condition-value {
    margin-top: 18px;
    font-size: 24px;
    font-weight: 800;
    color: #102a43;
}

.threshold-info {
    display: flex;
    gap: 18px;
    margin-top: 12px;
    color: #718096;
    font-size: 10px;
}

.status-neutral {
    background: #edf2f7;
    color: #718096;
}

.no-data-message {
    padding: 18px;
    color: #718096;
    background: #f8fafc;
    border-radius: 10px;
    font-size: 12px;
}

@media (max-width: 900px) {

    .condition-grid {
        grid-template-columns: 1fr;
    }
}
/* ========================================
   AI INVESTIGATION
======================================== */

.investigation-banner {
    margin-top: 26px;
    padding: 20px 22px;
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
}

.investigation-banner h2 {
    margin: 7px 0;
    font-size: 20px;
}

.investigation-banner p {
    margin: 0;
    color: #718096;
    font-size: 12px;
}


.investigation-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-top: 18px;
}


.investigation-panel {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 22px;
}

.investigation-panel h2 {
    margin: 8px 0 18px;
    font-size: 18px;
}


.evidence-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}


.evidence-item {
    padding: 13px;
    background: #f8fafc;
    border-radius: 9px;
    border: 1px solid #edf2f7;
}


.evidence-type {
    color: #1769aa;
    font-size: 9px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.7px;
}


.evidence-finding {
    margin-top: 6px;
    color: #334e68;
    font-size: 12px;
    line-height: 1.5;
}


.root-cause-panel {
    border-top: 4px solid #1769aa;
}


.root-cause-text {
    padding: 15px;
    background: #edf6ff;
    border-radius: 10px;
    color: #173f5f;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.6;
}

.imx-hero > * {
    position: relative;
    z-index: 2;
}

.imx-hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        90deg,
        rgba(255,255,255,0.16) 0%,
        rgba(255,255,255,0.04) 48%,
        rgba(0,61,110,0.10) 100%
    );
    pointer-events: none;
}


.cause-detail span {
    display: block;
    margin-bottom: 5px;
    color: #718096;
    font-size: 10px;
}


.cause-detail strong {
    color: #334e68;
    font-size: 12px;
    line-height: 1.5;
}


.traceability-note {
    margin-top: 18px;
    padding: 14px 16px;
    background: #fff9e8;
    border: 1px solid #f6e4aa;
    border-radius: 10px;
    color: #6b5a23;
    font-size: 11px;
    line-height: 1.6;
}


.recommendation-preview {
    margin-top: 18px;
    padding: 22px;
    background: #082b52;
    color: white;
    border-radius: 14px;

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 25px;
}


.recommendation-preview h2 {
    margin: 7px 0;
    font-size: 18px;
}


.recommendation-preview p {
    margin: 0;
    color: #c9dcec;
    font-size: 12px;
}


@media (max-width: 950px) {

    .investigation-layout {
        grid-template-columns: 1fr;
    }

}
/* ========================================
   ACTION RECOMMENDATIONS
======================================== */

.recommendation-context {
    margin-top: 24px;
    padding: 17px 19px;
    background: #edf6ff;
    border: 1px solid #cfe8ff;
    border-radius: 11px;
}

.recommendation-context strong {
    display: block;
    margin-top: 7px;
    color: #173f5f;
    font-size: 13px;
    line-height: 1.6;
}


.action-category {
    margin-top: 18px;
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    overflow: hidden;
}


.action-category-header {
    padding: 19px 21px;
    border-bottom: 1px solid #edf2f7;

    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
}


.action-category-header h2 {
    margin: 5px 0;
    font-size: 17px;
}


.action-category-header p {
    margin: 0;
    color: #718096;
    font-size: 11px;
}


.category-code {
    color: #1769aa;
    font-size: 10px;
    font-weight: 800;
}


.category-badge {
    padding: 6px 9px;
    background: #edf6ff;
    color: #1769aa;
    border-radius: 7px;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.6px;
}


.action-item {
    display: grid;
    grid-template-columns: 35px 1fr 150px;
    gap: 12px;
    align-items: center;

    padding: 14px 20px;
    border-bottom: 1px solid #edf2f7;
}


.action-item:last-child {
    border-bottom: none;
}


.action-number {
    width: 27px;
    height: 27px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #f1f5f9;
    border-radius: 50%;

    color: #52677b;
    font-size: 10px;
    font-weight: 800;
}


.action-text {
    color: #334e68;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.5;
}


.action-source {
    margin-top: 4px;
    color: #94a3b8;
    font-size: 8px;
    font-weight: 800;
    letter-spacing: 0.6px;
}


.decision-select {
    width: 100%;
    padding: 9px 10px;

    background: white;
    border: 1px solid #d9e2ec;
    border-radius: 8px;

    color: #334e68;
    font-size: 11px;
    cursor: pointer;
}


.corrective-category {
    border-left: 4px solid #c0392b;
}


.preventive-category {
    border-left: 4px solid #d68910;
}


.proactive-category {
    border-left: 4px solid #1e8449;
}


.human-validation-box {
    margin-top: 20px;
    padding: 22px;

    background: #082b52;
    color: white;
    border-radius: 14px;

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 25px;
}


.human-validation-box h2 {
    margin: 7px 0;
    font-size: 18px;
}


.human-validation-box p {
    margin: 0;
    color: #c9dcec;
    font-size: 11px;
}


@media (max-width: 850px) {

    .action-item {
        grid-template-columns: 30px 1fr;
    }

    .action-decision {
        grid-column: 2;
    }

}
/* ========================================
   ACTION ASSIGNMENT & HUB
======================================== */

.assignment-info {
    margin-top: 25px;
    padding: 15px 18px;
    background: #edf6ff;
    border: 1px solid #cfe8ff;
    border-radius: 10px;
}

.assignment-info strong {
    display: block;
    color: #173f5f;
    font-size: 13px;
}

.assignment-info span {
    display: block;
    margin-top: 4px;
    color: #718096;
    font-size: 11px;
}


.assignment-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 18px;
}


.assignment-card {
    padding: 19px;
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 13px;
}


.assignment-action {
    display: flex;
    align-items: center;
    gap: 12px;
}


.assignment-action strong {
    color: #334e68;
    font-size: 12px;
}


.assignment-fields {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 13px;
    margin-top: 17px;
}


.form-group label {
    display: block;
    margin-bottom: 6px;
    color: #718096;
    font-size: 9px;
    font-weight: 800;
    text-transform: uppercase;
}


.form-group select,
.form-group input {
    width: 100%;
    padding: 10px;

    background: white;
    border: 1px solid #d9e2ec;
    border-radius: 8px;

    color: #334e68;
    font-size: 11px;
}

.action-kpi-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-top: 26px;
}


.action-description-cell {
    min-width: 260px;
    line-height: 1.5;
}


.empty-table {
    padding: 35px !important;
    text-align: center !important;
    color: #94a3b8 !important;
}


@media (max-width: 900px) {

    .assignment-fields {
        grid-template-columns: 1fr;
    }

    .action-kpi-grid {
        grid-template-columns: 1fr;
    }

}
.action-update-btn {
    padding: 8px 14px;
    border: none;
    border-radius: 8px;
    background: #0f5bd8;
    color: white;
    font-weight: 600;
    cursor: pointer;
}

.action-update-btn:hover {
    opacity: 0.85;
}

    margin-top: 24px;
    padding: 24px;
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
}

.action-detail-panel h2 {
    margin-top: 0;
}

.action-detail-description {
    padding: 16px;

    border-radius: 10px;
    margin-bottom: 22px;
    line-height: 1.6;
}

.action-detail-panel select,
.action-detail-panel textarea {
    width: 100%;
    padding: 11px 12px;

.action-detail-panel textarea {

.action-detail-panel small {

.action-detail-panel .form-group {

.action-detail-panel label {

.action-status {

.action-status-open {

.action-status-progress {

/* =========================================
   IMX EXECUTIVE SINGLE PANE
========================================= */

    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;

}

.page-header h1 {
    margin: 0 0 8px 0;

}

.page-header p {
    margin: 0;

}

    padding: 8px 14px;
    border-radius: 999px;
    background: #e0f2fe;
    color: #075985;
    font-size: 12px;

    letter-spacing: 0.5px;

    border-radius: 16px;

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

.section-header h2 {
    margin: 0 0 6px 0;

.section-header p {
    margin: 0;
    color: #64748b;

    display: flex;
    align-items: stretch;

    border: 1px solid #dbeafe;

}

.flow-card strong {
    display: block;
    margin-bottom: 8px;

.flow-card span {

.flow-arrow {

/* ==========================================
   IMX FINAL VISUAL POLISH
   ========================================== */

body {
    background:
        radial-gradient(circle at top right, rgba(14, 165, 233, 0.08), transparent 28%),
        #f4f7fb;
}

/* MAIN CONTENT */

.main-content {
    background: transparent;
}

/* SIDEBAR */

.sidebar {
    background: linear-gradient(
        180deg,
        #071b33 0%,
        #0b2d52 55%,
        #0d3d70 100%
    );

    box-shadow: 8px 0 30px rgba(15, 23, 42, 0.08);
}

/* MENU */

.menu button {
    border-radius: 10px;
    transition: all 0.2s ease;
}

.menu button:hover {
    transform: translateX(3px);
    background: rgba(255, 255, 255, 0.10);
}

.menu button.active {
    background: rgba(56, 189, 248, 0.16);
    box-shadow: inset 3px 0 0 #38bdf8;
}

/* PAGE HEADER */

.page-header {
    background:
        linear-gradient(
            135deg,
            #ffffff 0%,
            #f7fbff 100%
        );

    border: 1px solid #e2e8f0;
    border-radius: 18px;
    padding: 24px 26px;

    box-shadow:
        0 8px 25px rgba(15, 23, 42, 0.04);
}

.page-header h1 {
    color: #0b2748;
    letter-spacing: -0.6px;
}

.page-header p {
    max-width: 720px;
    line-height: 1.6;
}

/* DATA BADGE */

.data-badge {
    background: linear-gradient(
        135deg,
        #e0f2fe,
        #dbeafe
    );

    border: 1px solid #bae6fd;
    color: #075985;

    box-shadow:
        0 3px 10px rgba(14, 165, 233, 0.08);
}

/* KPI CARDS */

.kpi-card {
    position: relative;
    overflow: hidden;

    border: 1px solid #e2e8f0;
    border-radius: 16px;

    box-shadow:
        0 7px 20px rgba(15, 23, 42, 0.045);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

.kpi-card::before {
    content: "";
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 3px;

    background: linear-gradient(
        90deg,
        #0f3d73,
        #0ea5e9
    );

    opacity: 0.8;
}

.kpi-card:hover {
    transform: translateY(-3px);

    box-shadow:
        0 12px 28px rgba(15, 23, 42, 0.08);
}

.kpi-label {
    letter-spacing: 0.45px;
}

.kpi-value {
    color: #092747;
    letter-spacing: -0.6px;
}

/* DETAIL SECTIONS */

.detail-section {
    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #fcfdff 100%
        );

    border: 1px solid #e2e8f0;
    border-radius: 18px;

    box-shadow:
        0 8px 24px rgba(15, 23, 42, 0.04);
}

/* SECTION TITLES */

.section-header h2 {
    color: #0b2748;
    letter-spacing: -0.3px;
}

/* TABLE */

.asset-table {
    border-collapse: separate;
    border-spacing: 0;
}

.asset-table thead th {
    background: #f1f5f9;
    color: #475569;

    font-size: 11px;
    letter-spacing: 0.55px;

    border-bottom: 1px solid #dbe4ee;
}

.asset-table tbody tr {
    transition: background 0.15s ease;
}

.asset-table tbody tr:hover {
    background: #f7fbff;
}

.asset-table tbody td {
    border-bottom: 1px solid #eef2f7;
}

/* DECISION FLOW */

.flow-card {
    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f7fbff
        );

    border: 1px solid #dbeafe;

    box-shadow:
        0 5px 16px rgba(15, 61, 115, 0.04);

    transition: all 0.2s ease;
}

.flow-card:hover {
    transform: translateY(-2px);
    border-color: #93c5fd;
}

.flow-card strong {
    color: #075985;
}

/* STATUS */

.status-red,
.status-amber,
.status-green,
.status-neutral {
    display: inline-block;

    padding: 5px 9px;
    border-radius: 999px;

    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.4px;
}

.status-red {
    background: #fee2e2;
    color: #b91c1c;
}

.status-amber {
    background: #fef3c7;
    color: #92400e;
}

.status-green {
    background: #dcfce7;
    color: #166534;
}

.status-neutral {
    background: #e2e8f0;
    color: #475569;
}

/* BUTTONS */

.back-btn,
.action-update-btn {
    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
}

.back-btn:hover,
.action-update-btn:hover {
    transform: translateY(-1px);
}

/* SCROLLBAR */

::-webkit-scrollbar {
    width: 9px;
    height: 9px;
}

::-webkit-scrollbar-track {
    background: #eef2f7;
}

::-webkit-scrollbar-thumb {
    background: #94a3b8;
    border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
    background: #64748b;
}
/* ==========================================
   IMX BRANDING
   ========================================== */

.imx-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 4px 14px 4px;
}

.imx-logo {
    width: 52px;
    height: 52px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #38bdf8,
            #2563eb
        );

    color: white;

    font-size: 18px;
    font-weight: 900;
    letter-spacing: 1px;

    box-shadow:
        0 8px 22px rgba(56, 189, 248, 0.22);
}

.imx-brand-text {
    display: flex;
    flex-direction: column;
    line-height: 1.25;
}

.imx-brand-text strong {
    color: #ffffff;
    font-size: 13px;
    font-weight: 700;
}

.imx-brand-text span {
    color: #7dd3fc;
    font-size: 12px;
    margin-top: 2px;
}

.imx-tagline {
    padding: 0 4px 17px 4px;

    color: #94a3b8;

    font-size: 11px;
    line-height: 1.55;
    letter-spacing: 0.25px;
}

.sidebar-divider {
    height: 1px;

    margin: 0 4px 18px 4px;

    background:
        linear-gradient(
            90deg,
            rgba(125, 211, 252, 0.35),
            rgba(255, 255, 255, 0.04)
        );
}
/* ==========================================
   IMX TOP HEADER
   ========================================== */
.top-header {
    position: absolute;
    top: 0;
    left: 216px;
    right: 0;

    height: 58px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 28px;

    background: rgba(255, 255, 255, 0.97);
    border-bottom: 1px solid #e2e8f0;
    box-shadow: 0 3px 14px rgba(15, 23, 42, 0.04);

    z-index: 20;
    box-sizing: border-box;
}
.top-header-left,
.top-header-right {
    display: flex;
    align-items: center;
}

.top-header-right {
    gap: 24px;
}

.system-status {
    display: flex;
    align-items: center;
    gap: 8px;

    font-size: 11px;
    font-weight: 800;
    color: #166534;

    letter-spacing: 0.5px;
}

.status-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;
    background: #22c55e;

    box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.12);
}

.header-selector {
    display: flex;
    align-items: center;
    gap: 7px;
}

.header-selector span {
    font-size: 10px;
    color: #94a3b8;
    font-weight: 700;
}

.header-selector strong {
    font-size: 11px;
    color: #0f2744;
}

.language-switch {
    display: flex;

    padding: 3px;

    background: #f1f5f9;
    border-radius: 8px;
}

.language-switch button {
    border: none;
    background: transparent;

    padding: 5px 8px;

    border-radius: 6px;

    font-size: 10px;
    font-weight: 800;

    color: #64748b;

    cursor: pointer;
}

.language-switch button.language-active {
    background: white;
    color: #0f3d73;

    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
}
@media (max-width: 1100px) {
    .top-header {
        left: 216px;
        padding: 0 16px;
    }

    .top-header-right {
        gap: 12px;
    }

    .header-selector span {
        display: none;
    }
}
/* ==========================================
   IMX SIDEBAR FINAL
   ========================================== */
.sidebar {
    position: fixed;

    top: 0;
    left: 0;

    width: 216px;
    height: 100vh;

    display: flex;
    flex-direction: column;

    padding: 22px 18px;

    box-sizing: border-box;

    background: linear-gradient(
        180deg,
        #071b33 0%,
        #092b4d 55%,
        #0b365f 100%
    );

    overflow-y: auto;
    overflow-x: hidden;

    z-index: 100;
}

/* BRAND */

.imx-brand {
    display: flex;
    align-items: center;
    gap: 11px;

    padding: 0 2px 12px 2px;
}

.imx-logo {
    width: 48px;
    height: 48px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 13px;

    background: linear-gradient(
        135deg,
        #38bdf8,
        #2563eb
    );

    color: white;

    font-size: 17px;
    font-weight: 900;
    letter-spacing: 1px;

    box-shadow:
        0 8px 20px rgba(37, 99, 235, 0.25);
}

.imx-brand-text {
    display: flex;
    flex-direction: column;

    min-width: 0;
}

.imx-brand-text strong {
    color: white;

    font-size: 11px;
    font-weight: 750;
    line-height: 1.25;
}

.imx-brand-text span {
    margin-top: 2px;

    color: #7dd3fc;

    font-size: 10px;
}


/* TAGLINE */

.imx-tagline {
    padding: 0 2px 15px 2px;

    color: #94a3b8;

    font-size: 10px;
    line-height: 1.55;
}


/* DIVIDER */

.sidebar-divider {
    width: 100%;
    height: 1px;

    margin-bottom: 18px;

    background: linear-gradient(
        90deg,
        rgba(56, 189, 248, 0.4),
        rgba(255, 255, 255, 0.04)
    );
}


/* MENU */

.menu {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.menu-btn {
    width: 100%;

    padding: 11px 12px;

    border: none;
    border-radius: 10px;

    background: transparent;

    color: #dbeafe;

    font-size: 12px;
    text-align: left;

    cursor: pointer;

    transition:
        background 0.2s ease,
        transform 0.2s ease;
}

.menu-btn:hover {
    background: rgba(255, 255, 255, 0.08);
    transform: translateX(2px);
}

.menu-btn.active {
    background: rgba(14, 165, 233, 0.17);

    color: white;

    box-shadow:
        inset 3px 0 0 #38bdf8;
}


/* FOOTER */

.sidebar-footer {
    margin-top: auto;
    padding: 18px 2px 2px 2px;
}

.sidebar-status {
    display: flex;
    align-items: center;
    gap: 7px;

    color: #86efac;

    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.4px;
}

.sidebar-status-dot {
    width: 7px;
    height: 7px;

    flex-shrink: 0;

    border-radius: 50%;
    background: #22c55e;

    box-shadow:
        0 0 0 3px rgba(34, 197, 94, 0.12);
}

.sidebar-version {
    margin-top: 8px;

    color: #64748b;

    font-size: 9px;
    line-height: 1.4;
}
.sidebar::-webkit-scrollbar:horizontal {
    display: none;
}
/* ==========================================
   LANGUAGE SWITCH
   ========================================== */

.language-control {
    position: fixed;

    top: 18px;
    right: 30px;

    z-index: 200;

    display: flex;
    align-items: center;
    gap: 10px;
}
/* Language moved to Single Pane header */
.sidebar .language-control {
    display: none;
}

.language-label {
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.7px;

    color: #94a3b8;
}

.language-toggle {
    display: flex;

    padding: 3px;

    border: 1px solid #e2e8f0;
    border-radius: 10px;

    background: rgba(255,255,255,0.92);

    box-shadow:
        0 5px 16px rgba(15,23,42,0.06);
}

.lang-btn {
    min-width: 34px;

    padding: 6px 9px;

    border: none;
    border-radius: 7px;

    background: transparent;

    color: #64748b;

    font-size: 10px;
    font-weight: 800;

    cursor: pointer;
}

.lang-btn.active {
    background: #0f3d73;
    color: white;

    box-shadow:
        0 3px 8px rgba(15,61,115,0.18);
}
/* =========================================================
   IMX — EXECUTIVE SINGLE PANE V2
   ========================================================= */

.imx-executive-page {
    width: 100%;
    max-width: 1500px;
    margin: 0 auto;
    padding-bottom: 40px;
}


/* ==========================================
   SINGLE PANE HEADER
   ========================================== */

.exec-page-header {
    display: grid;

    grid-template-columns:
        minmax(230px, 1fr)
        minmax(300px, 430px)
        auto;

    align-items: center;

    gap: 24px;

    margin-bottom: 18px;

    width: 100%;
}


/* ---------- TITLE ---------- */

.exec-title {
    min-width: 0;
}

.exec-title h1 {
    margin: 0;

    font-size: 30px;
    line-height: 1.1;

    color: #0b2948;

    font-weight: 800;
}

.exec-title p {
    margin: 6px 0 0;

    color: #6d7f95;

    font-size: 13px;

    line-height: 1.4;
}


/* ---------- CENTER SEARCH ---------- */

.exec-search {
    width: 100%;

    height: 38px;

    display: flex;
    align-items: center;

    background: #ffffff;

    border: 1px solid #dce5ef;

    border-radius: 10px;

    overflow: hidden;

    box-shadow:
        0 2px 8px rgba(15, 23, 42, 0.04);

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

.exec-search:focus-within {
    border-color: #2478c9;

    box-shadow:
        0 0 0 3px rgba(36, 120, 201, 0.10);
}


.exec-search input {
    flex: 1;

    width: 100%;

    height: 100%;

    border: none;

    outline: none;

    padding: 0 12px;

    background: transparent;

    color: #183653;

    font-size: 12px;
}

.exec-search input::placeholder {
    color: #9aaabd;
}


.exec-search button {
    width: 42px;

    height: 100%;

    border: none;

    border-left: 1px solid #edf1f5;

    background: #f8fafc;

    color: #175a98;

    font-size: 15px;

    cursor: pointer;

    transition: background 0.2s ease;
}

.exec-search button:hover {
    background: #edf6ff;
}


/* ---------- RIGHT CONTEXT ---------- */

.exec-context {
    display: flex;

    align-items: center;

    justify-content: flex-end;

    gap: 8px;

    font-size: 12px;

    color: #73849a;

    white-space: nowrap;
}


.exec-context select {
    height: 36px;

    padding: 0 30px 0 11px;

    border: 1px solid #dce5ef;

    border-radius: 9px;

    background: #ffffff;

    color: #183653;

    font-size: 11px;

    outline: none;

    cursor: pointer;
}

.exec-context select:focus {
    border-color: #2478c9;
}


/* ---------- LANGUAGE ---------- */

.header-language {
    display: flex;

    align-items: center;

    padding: 3px;

    margin-left: 2px;

    background: #f1f5f9;

    border-radius: 8px;
}


.header-lang-btn {
    border: none;

    background: transparent;

    padding: 5px 7px;

    border-radius: 6px;

    color: #64748b;

    font-size: 9px;

    font-weight: 800;

    cursor: pointer;
}


.header-lang-btn.active {
    background: #ffffff;

    color: #0f3d73;

    box-shadow:
        0 2px 6px rgba(15, 23, 42, 0.08);
}

.exec-page-header h1 {
    margin: 0;
    font-size: 30px;
    line-height: 1.1;
    color: #0b2948;
    font-weight: 800;
}

.exec-page-header p {
    margin: 6px 0 0;
    color: #6d7f95;
    font-size: 13px;
}

.exec-context {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #73849a;
}

.exec-context select {
    height: 36px;
    padding: 0 34px 0 12px;
    border: 1px solid #dce5ef;
    border-radius: 9px;
    background: #fff;
    color: #183653;
    outline: none;
}

.imx-hero::after {
    .imx-hero > * {
    position: relative;
    z-index: 2;
    }
    content: "";
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,0.16) 0%,
            rgba(255,255,255,0.04) 48%,
            rgba(0,61,110,0.10) 100%
        );

    pointer-events: none;
}


.imx-hero-overlay {
    position: relative;
    z-index: 2;
    min-height: 175px;
    padding: 26px 28px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.imx-hero-copy h2 {
    margin: 0;
    color: #12385c;
    font-size: 30px;
    font-weight: 800;
}

.imx-hero-copy h2 span {
    color: #2468cf;
}

.imx-hero-copy > p {
    margin: 7px 0 15px;
    max-width: 680px;
    color: #617992;
    font-size: 14px;
}

.hero-capabilities {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 12px;
}

.hero-capabilities span {
    background: rgba(255,255,255,.9);
    border: 1px solid #d8e5f0;
    box-shadow: 0 3px 9px rgba(24,69,107,.06);
    padding: 6px 10px;
    border-radius: 7px;
    color: #315779;
    font-size: 11px;
    font-weight: 700;
}

.imx-hero-copy small {
    color: #8192a5;
    font-size: 10px;
}

.hero-location {
    display: flex;
    flex-direction: column;
    min-width: 215px;
    padding: 14px 16px;
    border-radius: 12px;
    color: white;
    background: rgba(17,67,111,.88);
    box-shadow: 0 8px 25px rgba(11,49,82,.15);
}

.hero-location strong {
    font-size: 13px;
}

.hero-location span {
    margin-top: 4px;
    font-size: 10px;
    opacity: .8;
}


/* KPI GRID */

.executive-kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 12px;
    margin-bottom: 16px;
}

.exec-kpi {
    min-height: 126px;
    background: #fff;
    border: 1px solid #dce5ef;
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 5px 15px rgba(21,54,87,.04);
}

.kpi-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #6e8198;
    font-size: 10px;
    letter-spacing: .04em;
}

.status-dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
}

.status-dot.red {
    background: #ef5350;
}

.status-dot.green {
    background: #2aae7b;
}

.status-dot.amber {
    background: #f2a321;
}

.kpi-number,
.kpi-large {
    display: block;
    margin-top: 14px;
    color: #102f50;
    font-size: 24px;
    line-height: 1.05;
    font-weight: 800;
}

.kpi-large {
    font-size: 21px;
}

.exec-kpi small {
    display: block;
    margin-top: 8px;
    color: #8191a4;
    font-size: 10px;
}


/* DECISION STRIP */

.decision-strip {
    display: grid;
    grid-template-columns: repeat(5, minmax(0,1fr));
    gap: 10px;
    margin-bottom: 16px;
}

.decision-item {
    background: #fff;
    border: 1px solid #dce5ef;
    border-radius: 12px;
    padding: 13px 15px;
}

.decision-item span {
    display: block;
    color: #74869b;
    font-size: 9px;
    letter-spacing: .05em;
}

.decision-item strong {
    display: block;
    margin-top: 5px;
    color: #133756;
    font-size: 20px;
}

.decision-item small {
    color: #8998a8;
    font-size: 9px;
}


/* ANALYTICS */

.executive-analytics-grid {
    display: grid;
    grid-template-columns: 1.7fr 1fr;
    gap: 14px;
    margin-bottom: 18px;
}

.analytics-card {
    background: #fff;
    border: 1px solid #dce5ef;
    border-radius: 15px;
    padding: 17px;
    box-shadow: 0 5px 15px rgba(21,54,87,.04);
}

.analytics-heading {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 18px;
}

.analytics-heading h3 {
    margin: 0;
    color: #123655;
    font-size: 15px;
}

.analytics-heading p {
    margin: 4px 0 0;
    color: #8795a6;
    font-size: 10px;
}

.analytics-badge {
    padding: 4px 8px;
    border-radius: 6px;
    background: #edf6ff;
    color: #2872b7;
    font-size: 8px;
    font-weight: 800;
    letter-spacing: .05em;
}

.plant-bars {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.plant-bar-row {
    display: grid;
    grid-template-columns: 42px 1fr 65px;
    gap: 10px;
    align-items: center;
    font-size: 10px;
    color: #526a82;
}

.plant-bar-row strong {
    color: #567089;
    font-size: 9px;
    text-align: right;
}

.plant-bar-track {
    height: 11px;
    overflow: hidden;
    border-radius: 20px;
    background: #edf2f7;
}

.plant-bar-fill {
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg,#1765ad,#3093db);
}

.analytics-note {
    margin: 15px 0 0;
    padding-top: 11px;
    border-top: 1px solid #edf1f5;
    color: #8a98a8;
    font-size: 9px;
}


/* LIFECYCLE */

.lifecycle-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.lifecycle-list > div {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    background: #f7f9fc;
    border-radius: 8px;
}

.lifecycle-list span {
    color: #60758b;
    font-size: 9px;
}

.lifecycle-list strong {
    color: #123b60;
    font-size: 13px;
}


/* ATTENTION */

.attention-section {
    background: #fff;
    border: 1px solid #dce5ef;
    border-radius: 15px;
    padding: 19px;
    margin-bottom: 18px;
}

.section-heading-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 15px;
}

.section-heading-row h2 {
    margin: 0;
    color: #113655;
    font-size: 17px;
}

.section-heading-row p {
    margin: 4px 0 0;
    color: #8090a2;
    font-size: 10px;
}

.secondary-action-btn {
    border: 1px solid #cfe0ef;
    background: #f7fbff;
    color: #1767aa;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 10px;
    font-weight: 700;
    cursor: pointer;
}

.attention-cards {
    display: grid;
    grid-template-columns: repeat(3,minmax(0,1fr));
    gap: 10px;
}

.attention-card {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    position: relative;
    padding: 14px;
    border: 1px solid #dfe7ef;
    border-left: 4px solid #efa51d;
    border-radius: 10px;
}

.attention-card.critical {
    border-left-color: #e95353;
}

.attention-card h3 {
    margin: 5px 0 2px;
    color: #153a5b;
    font-size: 14px;
}

.attention-card p {
    margin: 0;
    color: #8091a2;
    font-size: 9px;
}

.attention-priority {
    display: inline-block;
    padding: 3px 6px;
    border-radius: 5px;
    background: #edf3f8;
    color: #365a78;
    font-size: 8px;
    font-weight: 800;
}

.attention-card > div:nth-child(2) {
    text-align: right;
}

.attention-card > div:nth-child(2) strong {
    display: block;
    margin-top: 6px;
    color: #163a5a;
    font-size: 14px;
}

.attention-card > div:nth-child(2) small {
    color: #8998a8;
    font-size: 8px;
}

.attention-state {
    font-size: 8px;
    font-weight: 800;
}

.critical-text {
    color: #db4141;
}

.attention-text {
    color: #db8a13;
}

.attention-card button {
    grid-column: 1 / -1;
    margin-top: 3px;
    border: 0;
    background: transparent;
    color: #1670b8;
    text-align: left;
    padding: 0;
    font-size: 10px;
    font-weight: 800;
    cursor: pointer;
}


/* DECISION FLOW */

.imx-decision-flow {
    background: #fff;
    border: 1px solid #dce5ef;
    border-radius: 15px;
    padding: 19px;
}

.decision-flow-steps {
    display: grid;
    grid-template-columns:
        1fr auto 1fr auto 1fr auto 1fr auto 1fr;
    align-items: center;
    gap: 8px;
}

.decision-flow-steps > div {
    min-height: 86px;
    padding: 13px;
    border-radius: 10px;
    background: #f6f9fc;
    border: 1px solid #e1e8ef;
}

.decision-flow-steps span {
    display: block;
    color: #3987c8;
    font-size: 9px;
    font-weight: 800;
}

.decision-flow-steps strong {
    display: block;
    margin-top: 6px;
    color: #153b5d;
    font-size: 12px;
}

.decision-flow-steps small {
    display: block;
    margin-top: 5px;
    color: #8594a4;
    font-size: 9px;
}

.decision-flow-steps > b {
    color: #83a4bf;
}


/* RESPONSIVE */

@media (max-width: 1200px) {

    .executive-kpi-grid {
        grid-template-columns: repeat(2,1fr);
    }

    .decision-strip {
        grid-template-columns: repeat(3,1fr);
    }

    .attention-cards {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 900px) {

    .exec-page-header {
        align-items: flex-start;
        flex-direction: column;
    }

    .executive-analytics-grid {
        grid-template-columns: 1fr;
    }

    .imx-hero-overlay {
        flex-direction: column;
        gap: 20px;
    }

    .decision-flow-steps {
        display: flex;
        flex-direction: column;
        align-items: stretch;
    }

    .decision-flow-steps > b {
        text-align: center;
        transform: rotate(90deg);
    }
}
/* ==========================================
   ASSET HEALTH V2
========================================== */

.asset-summary-v2 {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 14px;
    margin: 24px 0 18px;
}

.asset-summary-v2 .kpi-card {
    min-width: 0;
}

.asset-risk-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 14px;
    padding: 18px;
}

.asset-risk-card {
    background: #ffffff;
    border: 1px solid #e3eaf2;
    border-radius: 12px;
    padding: 16px;
    cursor: pointer;
    transition: transform 0.18s ease,
                box-shadow 0.18s ease,
                border-color 0.18s ease;
}

.asset-risk-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(15, 46, 77, 0.10);
    border-color: #b8d6ee;
}

.asset-risk-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
}

.asset-risk-top strong {
    display: block;
    color: #0b2d4d;
    font-size: 15px;
}

.asset-risk-top span {
    font-size: 11px;
}

.asset-risk-status {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
}

.asset-risk-status > span:last-child {
    font-size: 11px;
    color: #64748b;
}

.asset-risk-mode {
    min-height: 42px;
    margin-top: 13px;
    font-size: 12px;
    line-height: 1.45;
    color: #475569;
}

.asset-risk-metrics {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid #edf2f7;
}

.asset-risk-metrics div {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.asset-risk-metrics small {
    color: #7b8ba1;
    font-size: 10px;
}

.asset-risk-metrics strong {
    color: #173b5e;
    font-size: 11px;
}

@media (max-width: 1200px) {

    .asset-summary-v2 {
        grid-template-columns: repeat(3, 1fr);
    }

    .asset-risk-grid {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (max-width: 800px) {

    .asset-summary-v2,
    .asset-risk-grid {
        grid-template-columns: 1fr;
    }
}

        top: 14px;
        left: 14px;
        width: 44px;
        height: 44px;

        align-items: center;
        justify-content: center;

        border: none;
        border-radius: 12px;

        background: #0b355c;

        font-size: 23px;
        cursor: pointer;

        z-index: 3000;

        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);

    .mobile-overlay {
        display: none;
        position: fixed;
        inset: 0;

        background: rgba(4, 20, 38, 0.48);

        z-index: 1999;
    }

    body.mobile-menu-open .mobile-overlay {
        display: block;
    }

    /* ---------- SIDEBAR ---------- */
    .sidebar {
        position: fixed !important;

        top: 0;
        left: 0;

        width: min(82vw, 310px) !important;
        height: 100dvh !important;

        transform: translateX(-105%);
        transition: transform 0.25s ease;

        z-index: 2000;

        overflow-y: auto;

        box-shadow: 14px 0 35px rgba(0, 0, 0, 0.20);
    }

    body.mobile-menu-open .sidebar {

    }

    /* ---------- MAIN CONTENT ---------- */
    .main-content {
        margin-left: 0 !important;

        width: 100% !important;
        max-width: 100% !important;

        padding-left: 14px !important;
        padding-right: 14px !important;

        overflow-x: hidden;
    }

        width: 100% !important;

        align-items: flex-start !important;
        gap: 8px;

    .page-title,

        font-size: 28px !important;

    }

        border-radius: 18px !important;
    }

    .imx-hero h1,

        font-size: 32px !important;
        line-height: 1.08 !important;
    }

    .imx-hero p {
        font-size: 14px !important;
        line-height: 1.45 !important;
    }

    /* ---------- KPI CARDS ---------- */
    .kpi-grid,
    .exec-kpi-grid,
    .executive-kpi-grid {

        gap: 10px !important;

    .kpi-card {

    }

    .kpi-value,
    .kpi-number,
    .kpi-large {

    /* ---------- CHARTS ---------- */
    .chart-grid,

    /* ---------- TABLES ---------- */

/* =========================================================
   EARLY WARNING INTELLIGENCE
========================================================= */

.ew-kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
    margin: 18px 0;
}

.ew-kpi-card {
    background: #ffffff;
    border: 1px solid #dbe7f1;
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 6px 18px rgba(15, 60, 100, 0.06);
}

.ew-kpi-card span {
    display: block;
    font-size: 10px;
    font-weight: 700;
    color: #60778d;
    letter-spacing: .5px;
}

.ew-kpi-card strong {
    display: block;
    margin: 8px 0 4px;
    font-size: 28px;
    color: #0b355c;
}

.ew-kpi-card small {
    color: #71869a;
    font-size: 11px;
}


/* SECTIONS */

.ew-section {
    margin-top: 18px;
    padding: 22px;
    background: #ffffff;
    border: 1px solid #dbe7f1;
    border-radius: 18px;
    box-shadow: 0 8px 24px rgba(15, 60, 100, 0.06);
}

.ew-section-heading {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 18px;
}

.ew-section-heading h2 {
    margin: 3px 0 0;
    color: #0b355c;
    font-size: 19px;
}

.ew-section-heading p {
    margin: 5px 0 0;
    color: #70849a;
    font-size: 12px;
}

.ew-section-label,
.ew-card-label {
    display: block;
    color: #1685c4;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .8px;
}

.ew-traceable-badge,
.ew-high-badge,
.ew-confirmed-badge,
.ew-best-badge {
    display: inline-flex;
    align-items: center;
    padding: 6px 9px;
    border-radius: 999px;
    font-size: 8px;
    font-weight: 800;
    white-space: nowrap;
}

.ew-traceable-badge {
    color: #087353;
    background: #e7f8f1;
}

.ew-high-badge {
    color: #9a4e00;
    background: #fff1d9;
}

.ew-confirmed-badge {
    color: #087353;
    background: #e7f8f1;
}

.ew-best-badge {
    color: #075f9b;
    background: #e4f4ff;
}


/* ANALYTICAL PIPELINE */

.ew-pipeline {
    display: flex;
    align-items: stretch;
    gap: 7px;
    overflow-x: auto;
    padding: 4px 2px 10px;
}

.ew-step {
    flex: 1 0 120px;
    min-height: 110px;
    padding: 14px 12px;
    border-radius: 13px;
    background: linear-gradient(180deg, #f5faff, #edf6fd);
    border: 1px solid #d4e7f6;
}

.ew-step span {
    display: block;
    color: #229ad7;
    font-size: 10px;
    font-weight: 800;
    margin-bottom: 9px;
}

.ew-step strong {
    display: block;
    color: #0b355c;
    font-size: 12px;
    line-height: 1.3;
}

.ew-step small {
    display: block;
    margin-top: 9px;
    color: #74899e;
    font-size: 9px;
}

.ew-arrow {
    display: flex;
    align-items: center;
    color: #46aee0;
    font-size: 20px;
    font-weight: 700;
}


/* ASSET CARDS */

.ew-asset-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 13px;
}

.ew-asset-card {
    min-width: 0;
    padding: 15px;
    border-radius: 14px;
    border: 1px solid #dce8f2;
    background: #f9fcff;
}

.ew-asset-card.ew-highlight {
    border: 1px solid #43aee2;
    background: linear-gradient(180deg, #eef9ff, #ffffff);
    box-shadow: 0 7px 18px rgba(31, 151, 210, .10);
}

.ew-asset-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 6px;
}

.ew-asset-top > strong {
    color: #0b355c;
    font-size: 12px;
}

.ew-asset-card p {
    min-height: 34px;
    margin: 10px 0;
    color: #63798e;
    font-size: 10px;
    line-height: 1.4;
}

.ew-asset-metric strong {
    display: block;
    color: #0879bb;
    font-size: 24px;
}

.ew-asset-metric span,
.ew-signal {
    color: #73889b;
    font-size: 9px;
}

.ew-signal {
    padding-top: 10px;
    margin-top: 10px;
    border-top: 1px solid #e4edf4;
}


/* KO-3201 WARNING JOURNEY */

.ew-warning-panel {
    padding: 18px;
    border-radius: 15px;
    background: #f6faff;
    border: 1px solid #d7e8f5;
}

.ew-warning-top {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.ew-warning-top span {
    display: block;
    color: #74899e;
    font-size: 9px;
    font-weight: 700;
}

.ew-warning-top strong {
    display: block;
    margin-top: 4px;
    color: #0b355c;
    font-size: 14px;
}

.ew-timeline {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    margin-top: 24px;
}

.ew-point {
    text-align: center;
    color: #516a81;
    font-size: 9px;
}

.ew-point span {
    display: block;
    width: 14px;
    height: 14px;
    margin: 0 auto 6px;
    border-radius: 50%;
}

.warning-point span {
    background: #21a4df;
    box-shadow: 0 0 0 5px rgba(33, 164, 223, .13);
}

.failure-point span {
    background: #dc5b5b;
    box-shadow: 0 0 0 5px rgba(220, 91, 91, .12);
}

.ew-line {
    position: relative;
    height: 3px;
    margin: 0 12px 18px;
    background: linear-gradient(90deg, #21a4df, #f0a54a, #dc5b5b);
}

.ew-lead-label {
    position: absolute;
    left: 50%;
    top: -25px;
    transform: translateX(-50%);
    padding: 4px 9px;
    border-radius: 999px;
    background: #e8f6fd;
    color: #0879bb;
    font-size: 9px;
    font-weight: 800;
    white-space: nowrap;
}


/* EVIDENCE */

.ew-evidence-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    margin-top: 14px;
}

.ew-evidence-card {
    padding: 17px;
    border-radius: 14px;
    background: #ffffff;
    border: 1px solid #dce8f2;
}

.ew-evidence-card h3 {
    margin: 6px 0 8px;
    color: #0b355c;
    font-size: 14px;
}

.ew-evidence-card p {
    margin: 0;
    color: #647a8e;
    font-size: 10px;
    line-height: 1.55;
}


/* RECOMMENDATION */

.ew-recommendation {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 22px;
    margin-top: 14px;
    padding: 18px;
    border-radius: 15px;
    background: linear-gradient(90deg, #0b355c, #12689b);
    color: white;
}

.ew-recommendation h3 {
    margin: 5px 0;
    color: white;
    font-size: 15px;
}

.ew-recommendation p {
    max-width: 720px;
    margin: 0;
    color: #d8eaf6;
    font-size: 10px;
    line-height: 1.5;
}

.ew-recommendation .ew-card-label {
    color: #70d0ff;
}

.ew-action-btn {
    flex-shrink: 0;
    padding: 11px 15px;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 10px;
    background: white;
    color: #0b5d8d;
    font-size: 10px;
    font-weight: 800;
    cursor: pointer;
}

.ai-body { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; padding: 8px 8px 12px; }

            title: "Maintenance",
            message:
                "Equipment condition, maintenance priorities and action execution.",
            highlight: [
                "high-criticality-assets",
                "historical-downtime",
                "active-incidents"
            ]
        },

        reliability: {
            title: "Reliability",
            message:
                "Asset health, failure patterns and root cause investigation.",
            highlight: [
                "high-criticality-assets",
                "historical-downtime",
                "manufacturing-health"
            ]
        },

        energy: {
            title: "Energy",
            message:
                "Energy performance, emissions visibility and operating efficiency.",
            highlight: [
                "production",
                "production-loss"
            ]
        }
    };

    const config =
        roleConfig[role] || roleConfig.executive;

    // Update role guidance
    const guide =
        document.getElementById("roleViewMessage");

    if (guide) {
        guide.innerHTML =
            `<strong>${config.title}</strong> · ${config.message}`;



// ==========================================
// SINGLE PANE HEADER SEARCH
// ==========================================

// (legacy header-search wiring removed — see executeHeaderSearch in the AI module)
    }
    

    // Reset all KPI cards
    document
        .querySelectorAll(".kpi-card")
        .forEach(card => {
            card.classList.remove("role-highlight");
            card.classList.remove("role-muted");
        });

    // Apply role emphasis
    document
        .querySelectorAll(".kpi-card")
        .forEach(card => {

            const metric =
                card.dataset.metric;

            if (!metric) return;

            if (config.highlight.includes(metric)) {
                card.classList.add("role-highlight");
            } else {
                card.classList.add("role-muted");
            }
        });

    console.log(
        `IMX role view applied: ${config.title}`
    );
}

function renderExecutiveCharts() {

    console.log("IMX: rendering executive charts...");

    if (typeof Chart === "undefined") {
        console.error("IMX: Chart.js is not loaded.");
        return;
    }

    // Prevent duplicate charts when Single Pane is rendered again
    if (window.imxExecutiveCharts) {
        Object.values(window.imxExecutiveCharts).forEach(chart => {
            if (chart && typeof chart.destroy === "function") {
                chart.destroy();
            }
        });
    }

    window.imxExecutiveCharts = {};

    // 1. LOSS & DOWNTIME BY MONTH

    const lossDowntimeCanvas =
        document.getElementById("lossDowntimeChart");

        // Use the full governed Incident Database
        const incidents = Array.isArray(window.imxIncidents)
    ? window.imxIncidents
    : [];

const monthlyMap = {};

incidents.forEach(incident => {

    const rawDate = incident.occurrenceDate;

    if (!rawDate) return;

    const incidentDate = new Date(rawDate);

    if (Number.isNaN(incidentDate.getTime())) return;

    const year = incidentDate.getFullYear();
    const monthIndex = incidentDate.getMonth();

    const key =
        `${year}-${String(monthIndex + 1).padStart(2, "0")}`;

    if (!monthlyMap[key]) {
        monthlyMap[key] = {
            key,
            year,
            monthIndex,
            loss: 0,
            downtime: 0,
            incidents: 0
        };
    }

    const loss = Number(incident.totalLoss) || 0;
    const downtime = Number(incident.downtime) || 0;

    monthlyMap[key].loss += loss;
    monthlyMap[key].downtime += downtime;
    monthlyMap[key].incidents += 1;
});

const monthlyData = Object.values(monthlyMap)
    .sort((a, b) => {
        return (
            new Date(a.year, a.monthIndex, 1) -
            new Date(b.year, b.monthIndex, 1)
        );
    })
    .map(item => ({
        ...item,

        month: new Date(
            item.year,
            item.monthIndex,
            1
        ).toLocaleDateString("en-US", {
            month: "short",
            year: "2-digit"
        })
    }));

console.log(

            dataPromises.push(window.imxProductionReady);

function getAssetStatus(asset) {

    if (asset.criticality === "High" && asset.tripCount > 0) {
        return {
            status: "CRITICAL",
            className: "status-red"
        };
    }

    if (asset.tripCount > 0 || asset.alarmCount >= 10) {
        return {
            status: "ATTENTION",
            className: "status-amber"
        };
    }

    return {
        status: "MONITOR",
        className: "status-green"
    };
}


function getAssetPriority(asset) {

    if (asset.criticality === "High" && asset.tripCount > 0) {
        return "P1";
    }

    if (asset.tripCount > 0 && asset.alarmCount >= 10) {
        return "P2";
    }

    if (asset.tripCount > 0) {
        return "P3";
    }

    return "P4";
}

// CONDITION UNIT NORMALIZATION
// ========================================

function getConditionUnit(condition) {

    // 1. Use governed unit if available
    if (
        condition.unit &&
        condition.unit !== "undefined" &&
        condition.unit !== "null"
    ) {
        return condition.unit;
    }

    // 2. Otherwise extract unit from parameter name
    const parameter = String(condition.parameter || "");

    const match = parameter.match(/\(([^)]+)\)/);

    if (match && match[1]) {
        return match[1].trim();
    }

    // 3. No unit available
    return "";
}

async function showAssetDetail(tag) {
    const asset = (
        window.imxAssets ||
        window.imxEquipmentMaster ||
        []
    ).find(item => item.tag === tag);
    let conditionData = [];
    let assetConditions = [];

    try {

        conditionData = window.imxConditionData;

        if (!conditionData || conditionData.length === 0) {

            await buildEquipmentMaster();

            conditionData = window.imxConditionData;
        }

        assetConditions = conditionData.filter(function (condition) {
        return condition.tag === tag;
        });

        console.log(
            `Condition Evidence for ${tag}:`,
            assetConditions
        );

    }
    catch (error) {

        console.error("Condition history error:", error);

    }

    if (!asset) {
        return;
    }


    const health = getAssetStatus(asset);
    const priority = getAssetPriority(asset);
    let conditionCards = "";

    assetConditions.forEach(function (condition) {

    let latestValue = condition.latestValue;

    const displayUnit = getConditionUnit(condition);

    if (condition.history && condition.history.length > 0) {
        latestValue =

// ========================================
// FAILURE EVENT PLUGIN
// ========================================

const failureEventPlugin = {

    id: "failureEventMarker",

    afterDraw(chart, args, pluginOptions) {

        if (!pluginOptions || !pluginOptions.failureDate) {
            return;
        }

        const labels = chart.data.labels || [];

        if (labels.length === 0) {
            return;
        }

        const targetDate = new Date(pluginOptions.failureDate);

        if (isNaN(targetDate.getTime())) {
            return;
        }

        let closestIndex = -1;
        let closestDistance = Infinity;

        labels.forEach(function (label, index) {

            const date = new Date(label);

            if (isNaN(date.getTime())) {
                return;
            }

            const distance = Math.abs(
                date.getTime() - targetDate.getTime()
            );

            if (distance < closestDistance) {
                closestDistance = distance;
                closestIndex = index;
            }
        });

        if (closestIndex < 0) {
            return;
        }

        const xScale = chart.scales.x;
        const yScale = chart.scales.y;

        if (!xScale || !yScale) {
            return;
        }

        const x = xScale.getPixelForValue(closestIndex);
        const ctx = chart.ctx;

        ctx.save();

        // Vertical failure line
        ctx.beginPath();
        ctx.setLineDash([6, 5]);
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#dc2626";

        ctx.moveTo(x, yScale.top);
        ctx.lineTo(x, yScale.bottom);
        ctx.stroke();

        ctx.setLineDash([]);

        // Failure event label
        const label = "FAILURE EVENT";

        ctx.font = "600 10px Arial";

        const labelWidth =
            ctx.measureText(label).width + 14;

        let labelX = x + 6;

        if (labelX + labelWidth > chart.chartArea.right) {
            labelX = x - labelWidth - 6;
        }

        ctx.fillStyle = "#dc2626";

        ctx.fillRect(
            labelX,
            yScale.top + 8,
            labelWidth,
            20
        );

        ctx.fillStyle = "#ffffff";

        ctx.fillText(
            label,
            labelX + 7,
            yScale.top + 22
        );

        ctx.restore();
    }
};

function initializeAssetConditionChart(asset, conditions) {

    const selector =
        document.getElementById("conditionParameterSelect");

    const canvas =
        document.getElementById("assetConditionChart");


    if (
        !selector ||
        !canvas ||
        !Array.isArray(conditions) ||
        conditions.length === 0
    ) {
        console.warn(
            "Condition chart unavailable:",
            asset ? asset.tag : "Unknown Asset"
        );

        return;
    }


    // Only use parameters that contain historical data
    const availableConditions =
        conditions.filter(function (condition) {

            return (
                Array.isArray(condition.history) &&
                condition.history.length > 0
            );

        });


    if (availableConditions.length === 0) {

        console.warn(
            "No historical condition data for:",
            asset.tag
        );

        return;
    }


    // Build parameter selector
    selector.innerHTML =
        availableConditions
            .map(function (condition, index) {

                const unit = condition.unit || "";

                return `
                    <option value="${index}">
                        ${condition.parameter}
                        ${unit ? `(${unit})` : ""}
                    </option>
                `;

            })
            .join("");


    function renderConditionTrend(index) {

        const condition =
            availableConditions[index];

        if (!condition) {
            return;
        }


        const history = condition.history;


        // X-axis labels
        const labels =
            history.map(function (point) {

                return (
                    point.timestamp ||
                    point.date ||
                    point.time ||
                    ""
                );

            });


        // Actual measurements
        const actualValues =
            history.map(function (point) {

                const value = Number(point.value);

                return Number.isFinite(value)
                    ? value
                    : null;

            });


        const alarmLimit =
            Number(condition.alarmLimit);

        const tripLimit =
            Number(condition.tripLimit);


        const alarmValues =
            history.map(function () {

                return Number.isFinite(alarmLimit)
                    ? alarmLimit
                    : null;

            });


        const tripValues =
            history.map(function () {

                return Number.isFinite(tripLimit)
                    ? tripLimit
                    : null;

            });


        const unit = getConditionUnit(condition);


        const parameterLabel =
            unit
                ? `${condition.parameter} (${unit})`
                : condition.parameter;


        // Destroy previous chart before rendering another parameter
        if (assetConditionChartInstance) {

            assetConditionChartInstance.destroy();

            assetConditionChartInstance = null;
        }


        assetConditionChartInstance =
            new Chart(
                canvas.getContext("2d"),
                {

                    type: "line",

                    plugins: [
                        failureEventPlugin
                    ],

                    data: {

                        labels: labels,

                        datasets: [

                            {
                                label: parameterLabel,

                                data: actualValues,

                                borderWidth: 2.5,

                                pointRadius: 3,

                                pointHoverRadius: 5,

                                tension: 0.18
                            },

                            {
                                label:
                                    unit
                                        ? `Alarm Threshold (${alarmLimit} ${unit})`
                                        : `Alarm Threshold (${alarmLimit})`,

                                data: alarmValues,

                                borderWidth: 1.5,

                                borderDash: [7, 5],

                                pointRadius: 0,

                                tension: 0
                            },

                            {
                                label:
                                    unit
                                        ? `Trip Threshold (${tripLimit} ${unit})`
                                        : `Trip Threshold (${tripLimit})`,

                                data: tripValues,

                                borderWidth: 1.5,

                                borderDash: [3, 4],

                                pointRadius: 0,

                                tension: 0
                            }

                        ]
                    },


                    options: {

                        responsive: true,

                        maintainAspectRatio: false,

                        interaction: {
                            mode: "index",
                            intersect: false
                        },


                        plugins: {

                            failureEventMarker: {
                                failureDate: asset.failureDate
                            },

                            legend: {
                                position: "top",
                                align: "end"
                            },

                            tooltip: {

                                callbacks: {

                                    label: function (context) {

                                        const value =
                                            context.parsed.y;

                                        return (
                                            context.dataset.label +
                                            ": " +
                                            value
                                        );
                                    }
                                }
                            }
                        },


                        scales: {

                            x: {

                                grid: {
                                    display: false
                                },

                                ticks: {
                                    maxRotation: 45,
                                    minRotation: 0,
                                    autoSkip: true,
                                    maxTicksLimit: 12
                                }
                            },


                            y: {

                                beginAtZero: false,

                                title: {

                                    display: true,

                                    text: parameterLabel
                                },

                                grid: {
                                    color:
                                        "rgba(130,150,170,0.12)"
                                }
                            }
                        }
                    }
                }
            );
    }


    // Initial parameter
    renderConditionTrend(0);


    // Change parameter
    selector.addEventListener(
        "change",
        function () {

            renderConditionTrend(
                Number(this.value)
            );
        }
    );
}


// ========================================
// PARAMETER STATUS
// ========================================

function calculateParameterStatus(
    value,
    alarmLimit,
    tripLimit,
    direction
) {

    const numericValue = Number(value);
    const numericAlarm = Number(alarmLimit);
    const numericTrip = Number(tripLimit);


    if (!Number.isFinite(numericValue)) {

        return {
            status: "NO DATA",
            className: "status-neutral"
        };
    }


    // Higher value = worse condition
    if (direction === "high") {

        if (
            Number.isFinite(numericTrip) &&
            numericValue >= numericTrip
        ) {

            return {
                status: "TRIP",
                className: "status-red"
            };
        }


        if (
            Number.isFinite(numericAlarm) &&
            numericValue >= numericAlarm
        ) {

            return {
                status: "ALARM",
                className: "status-amber"
            };
        }


        return {
            status: "NORMAL",
            className: "status-green"
        };
    }


    // Lower value = worse condition
    if (direction === "low") {

        if (
            Number.isFinite(numericTrip) &&
            numericValue <= numericTrip
        ) {

            return {
                status: "TRIP",
                className: "status-red"
            };
        }


        if (
            Number.isFinite(numericAlarm) &&
            numericValue <= numericAlarm
        ) {

            return {
                status: "ALARM",
                className: "status-amber"
            };
        }


        return {
            status: "NORMAL",
            className: "status-green"
        };
    }


    return {
        status: "NO DATA",
        className: "status-neutral"
    };
}

async function prepareActionAssignment(tag) {

    const approvedActions = [];

    document.querySelectorAll(".decision-select").forEach(function (select) {

        if (select.value === "Approved") {

            const actionItem = select.closest(".action-item");

            const actionText =
                actionItem.querySelector(".action-text").innerText;

            let actionType = "Action";

            if (select.id.startsWith("corrective")) {
                actionType = "Corrective";
            }

            else if (select.id.startsWith("preventive")) {
                actionType = "Preventive";
            }

            else if (select.id.startsWith("proactive")) {
                actionType = "Proactive";
            }

            approvedActions.push({
                text: actionText,

function createIMXActions(tag) {

    const pendingActions =
        window.pendingIMXActions || [];

    const newActions = [];


    for (let index = 0; index < pendingActions.length; index++) {

        const action = pendingActions[index];

        const pic =
            document.getElementById(`pic-${index}`).value;

        const dueDate =
            document.getElementById(`due-${index}`).value;

        const priority =
            document.getElementById(`priority-${index}`).value;


        if (!pic || !dueDate) {

            alert(
                "Please assign PIC and Due Date for every action."
            );

            return;
        }


        const actionID =
            "ACT-" +
            Date.now().toString().slice(-6) +
            "-" +
            (index + 1);


        newActions.push({

            id: actionID,

            tag: tag,

            type: action.type,

            action: action.text,

            pic: pic,

            dueDate: dueDate,

            priority: priority,

            status: "OPEN",

            source: "IMX RCA Recommendation",

            createdAt:
                new Date().toISOString()

        });

    }


    const existingActions =
        JSON.parse(
            localStorage.getItem("imxActions")
        ) || [];


    const updatedActions =
        existingActions.concat(newActions);


    localStorage.setItem(
        "imxActions",
        JSON.stringify(updatedActions)
    );


    console.log(
        "IMX Actions Created:",
        newActions
    );


    showActionHub();
}

function saveActionUpdate(actionId) {

    const actions = JSON.parse(localStorage.getItem("imxActions")) || [];

    const actionIndex = actions.findIndex(function (item) {
        return item.id === actionId;
    });

    if (actionIndex === -1) {
        alert("Action not found.");
        return;
    }

    const newStatus = document.getElementById("actionStatus").value;

    const closureEvidence =
        document.getElementById("closureEvidence").value.trim();

    if (newStatus === "CLOSED" && closureEvidence === "") {
        alert("Closure Evidence is required before an action can be CLOSED.");
        return;
    }

    actions[actionIndex].status = newStatus;
    actions[actionIndex].closureEvidence = closureEvidence;
    actions[actionIndex].lastUpdated = new Date().toISOString();

    if (newStatus === "CLOSED") {

        if (!actions[actionIndex].closedAt) {
            actions[actionIndex].closedAt = new Date().toISOString();
        }

    } else {
        actions[actionIndex].closedAt = null;
    }

    localStorage.setItem(
        "imxActions",
        JSON.stringify(actions)
    );

    alert("Action updated successfully.");

    showActionHub();
}

function cleanParameterLimits(workbook, tag) {

    const sheet = workbook.Sheets["Equipment Info"];

    const rows = XLSX.utils.sheet_to_json(sheet, {
        header: 1,
        defval: null
    });

    const parameterLimits = [];

    rows.forEach(row => {

        const parameter = row[2];
        const limitText = row[3];

        if (
            parameter &&
            limitText &&
            String(limitText).includes("/")
        ) {

            const parts = String(limitText).split("/");

            const alarmLimit = parseFloat(parts[0].trim());
            const tripLimit = parseFloat(parts[1].trim());

            if (
                !isNaN(alarmLimit) &&
                !isNaN(tripLimit)
            ) {

                parameterLimits.push({
                    tag: tag,
                    parameter: parameter,
                    alarmLimit: alarmLimit,
                    tripLimit: tripLimit,

                    // Jika alarm < trip berarti semakin tinggi semakin buruk
                    // Jika alarm > trip berarti semakin rendah semakin buruk
                    direction: alarmLimit < tripLimit ? "high" : "low"
                });
            }
        }
    });

    return parameterLimits;
}
// ==========================================
// BUILD GOVERNED CONDITION DATA
// ==========================================

function buildGovernedConditionData(
    conditionHistory,
    parameterLimits,
    tag
) {

    if (!conditionHistory || conditionHistory.length < 2) {
        return [];
    }

    // Row pertama = header dari Excel
    const headers = conditionHistory[0];

    const governedConditions = [];

    parameterLimits.forEach(limit => {

        // Cari posisi kolom parameter di Condition History
        // Normalize parameter names before matching
        function normalizeParameterName(name) {

            return String(name || "")
                .toLowerCase()

                // Remove unit inside brackets
                .replace(/\([^)]*\)/g, "")

                // Standardize common naming differences
                .replace(/temperature/g, "temp")
                .replace(/pressure/g, "press")
                .replace(/vibration/g, "vib")

                // Remove symbols and spaces
                .replace(/[^a-z0-9]/g, "")
                .trim();
        }

        const normalizedLimit = normalizeParameterName(limit.parameter);

        const parameterIndex = headers.findIndex(header => {

            if (!header) return false;

            const normalizedHeader = normalizeParameterName(header);

            return (
                normalizedHeader === normalizedLimit ||
                normalizedHeader.includes(normalizedLimit) ||
                normalizedLimit.includes(normalizedHeader)
            );
        });

        if (parameterIndex === -1) {
            console.warn(
                `Parameter "${limit.parameter}" not found in Condition History for ${tag}`
            );
            return;
        }

        const history = [];

        // Mulai dari row 1 karena row 0 adalah header
        for (let i = 1; i < conditionHistory.length; i++) {

            const row = conditionHistory[i];

            if (!row) continue;

            const value = row[parameterIndex];

            if (value === null || value === undefined || value === "") {
                continue;
            }

            history.push({
                week: row[0],
                date: row[1],
                value: value,
                healthStatus: row[6],
                remark: row[7]
            });
        }

        governedConditions.push({
            tag: tag,
            parameter: limit.parameter,
            alarmLimit: limit.alarmLimit,
            tripLimit: limit.tripLimit,
            direction: limit.direction,
            history: history
        });
    });

    return governedConditions;
}
